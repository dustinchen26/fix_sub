<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 字幕錯字修正工具</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .highlight-old {
      background-color: #fee2e2;
      color: #991b1b;
      text-decoration: line-through;
      padding: 0 4px;
      border-radius: 4px;
      font-weight: 600;
    }
    .highlight-new {
      background-color: #dcfce7;
      color: #166534;
      padding: 0 4px;
      border-radius: 4px;
      font-weight: 600;
    }
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Toast 訊息通知容器 -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header 頂部導覽 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-200">
          <i class="fa-solid font-bold fa-closed-captioning text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-lg sm:text-xl leading-tight">SRT 字幕錯字修正工具</h1>
          <p class="text-xs text-slate-500 hidden sm:block">快速比對、批次替換、即時預覽與正確 SRT 匯出</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-export-top" onclick="exportSRT()" disabled class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-sm font-medium rounded-lg transition-all shadow-sm flex items-center gap-2">
          <i class="fa-solid fa-download"></i>
          <span class="hidden sm:inline">下載修正後的 SRT</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區域 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full flex flex-col gap-6">

    <!-- 上傳區域與狀態統計卡片 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- 拖拽上傳區 -->
      <div class="lg:col-span-2 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-center">
        <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all rounded-xl p-8 text-center cursor-pointer flex flex-col items-center justify-center gap-3 group">
          <input type="file" id="file-input" accept=".srt" class="hidden" onchange="handleFileSelect(event)" />
          <div class="w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-file-arrow-up text-2xl"></i>
          </div>
          <div>
            <p class="font-semibold text-slate-700 text-base">拖曳 SRT 檔案至此，或 <span class="text-indigo-600 underline">點擊上傳</span></p>
            <p class="text-xs text-slate-400 mt-1">僅支援 UTF-8 編碼之 .srt 檔案格式</p>
          </div>
          <div id="file-info" class="hidden mt-2 text-sm text-indigo-700 font-medium bg-indigo-100/60 px-3 py-1.5 rounded-full flex items-center gap-2">
            <i class="fa-solid fa-file-code"></i>
            <span id="file-name">filename.srt</span>
          </div>
        </div>
      </div>

      <!-- 狀態統計與快速操作 -->
      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
        <div>
          <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 mb-4">
            <i class="fa-solid fa-chart-pie text-indigo-500"></i>
            修正統計狀態
          </h2>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
              <span class="text-xs font-medium text-slate-500 block mb-1">總字幕句數</span>
              <span id="stat-total-count" class="text-2xl font-bold text-slate-800">0</span>
            </div>
            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
              <span class="text-xs font-medium text-emerald-600 block mb-1">已修正項數</span>
              <span id="stat-replaced-count" class="text-2xl font-bold text-emerald-700">0</span>
            </div>
          </div>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex flex-col gap-2">
          <button onclick="copyToClipboard()" id="btn-copy" disabled class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed text-slate-700 font-medium text-sm rounded-xl transition flex items-center justify-center gap-2">
            <i class="fa-regular fa-copy"></i> 複製修正後全文至剪貼簿
          </button>
        </div>
      </div>

    </div>

    <!-- 規則設定與預覽主要分頁/分欄區域 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
      
      <!-- 左側：替換規則設定 (4欄) -->
      <div class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden h-[600px] lg:h-auto">
        <!-- 規則標題與操作按鈕 -->
        <div class="p-4 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i>
            <h2 class="font-bold text-slate-800 text-sm">錯字修正規則設定</h2>
          </div>
          <button onclick="loadPresetRules()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200 px-2.5 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
            <i class="fa-solid fa-wand-magic-sparkles"></i> 載入常見繁體錯字
          </button>
        </div>

        <!-- 比對選項設定 -->
        <div class="p-3 bg-slate-100/60 border-b border-slate-200 text-xs flex flex-wrap gap-4 text-slate-600">
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input type="checkbox" id="opt-regex" onchange="applyReplacements()" class="rounded text-indigo-600 focus:ring-indigo-500">
            <span>支援正則表達式 (Regex)</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input type="checkbox" id="opt-case" onchange="applyReplacements()" class="rounded text-indigo-600 focus:ring-indigo-500">
            <span>區分大小寫</span>
          </label>
        </div>

        <!-- 新增單一規則輸入框 -->
        <div class="p-4 border-b border-slate-200 flex flex-col gap-2 bg-white">
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="rule-search" placeholder="原錯字 (例如: 帳號)" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
            <input type="text" id="rule-replace" placeholder="修正後 (例如: 帳戶)" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
          </div>
          <button onclick="addSingleRule()" class="w-full py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded-lg transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-plus"></i> 新增此替換規則
          </button>
        </div>

        <!-- 規則列表 -->
        <div class="flex-1 overflow-y-auto p-4 space-y-2" id="rules-list">
          <div class="text-center text-slate-400 text-xs py-8">尚無對應規則，請從上方新增或「載入常見繁體錯字」</div>
        </div>

        <!-- 清空規則 -->
        <div class="p-3 border-t border-slate-200 bg-slate-50/50 flex justify-between items-center text-xs text-slate-500">
          <span id="rules-count">規則總數：0</span>
          <button onclick="clearAllRules()" class="text-red-500 hover:text-red-700 transition">清空所有規則</button>
        </div>
      </div>

      <!-- 右側：字幕即時預覽與對比 (8欄) -->
      <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden h-[600px] lg:h-auto">
        
        <!-- 預覽標題與關鍵字過濾 -->
        <div class="p-4 border-b border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-eye text-indigo-600"></i>
            <h2 class="font-bold text-slate-800 text-sm">字幕即時預覽與修正對比</h2>
          </div>
          
          <!-- 關鍵字搜尋 -->
          <div class="relative w-full sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            <input type="text" id="search-filter" oninput="renderSubtitles()" placeholder="搜尋字幕內容..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- 字幕清單標頭 -->
        <div class="grid grid-cols-12 gap-2 px-4 py-2 bg-slate-100/80 border-b border-slate-200 text-xs font-semibold text-slate-600">
          <div class="col-span-2 sm:col-span-1">#</div>
          <div class="col-span-4 sm:col-span-3">時間軸</div>
          <div class="col-span-6 sm:col-span-8">字幕對比與編輯（<span class="text-red-500">刪除線為原字</span> / <span class="text-emerald-600">綠色為新字</span>）</div>
        </div>

        <!-- 字幕即時內容列表 -->
        <div id="subtitles-container" class="flex-1 overflow-y-auto divide-y divide-slate-100">
          <div class="h-full flex flex-col items-center justify-center p-8 text-slate-400 text-center gap-3">
            <i class="fa-regular fa-closed-captioning text-4xl"></i>
            <p class="text-sm">請在上方的拖曳區上傳 `.srt` 字幕檔案以開始比對修正</p>
          </div>
        </div>

        <!-- 列表頁尾資訊 -->
        <div class="p-3 border-t border-slate-200 bg-slate-50/50 flex justify-between items-center text-xs text-slate-500">
          <span id="showing-count">目前顯示：0 句</span>
          <span class="text-slate-400">提示：點擊右側內容可直接手動修改文字</span>
        </div>

      </div>

    </div>

  </main>

    // 全域變數狀態
    let originalSRT = []; // 原始解析後的 SRT 物件陣列 { id, time, text }
    let modifiedSRT = []; // 修正後的 SRT 物件陣列 { id, time, text, hasChanged }
    let originalFileName = "subtitles.srt";

    // 頁面載入後自動呈現內建字典清單
    window.onload = function() {
      renderRulesPreview();
    };

    // 渲染顯示當前程式碼內設定的字典規則
    function renderRulesPreview() {
      const container = document.getElementById('rules-list');
      const keys = Object.keys(REPLACE_MAP);
      document.getElementById('rules-count').textContent = `字典規則數：${keys.length}`;

      if (keys.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">程式碼內目前無任何替換規則</div>`;
        return;
      }

      container.innerHTML = keys.map(search => `
        <div class="flex items-center justify-between p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
          <div class="flex items-center gap-2 overflow-hidden w-full">
            <span class="font-medium text-red-600 bg-red-50 px-2 py-0.5 rounded truncate border border-red-100 flex-1 text-center">${escapeHtml(search)}</span>
            <i class="fa-solid fa-arrow-right text-slate-400 text-[10px]"></i>
            <span class="font-medium text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded truncate border border-emerald-100 flex-1 text-center">${escapeHtml(REPLACE_MAP[search] || '(刪除)')}</span>
          </div>
        </div>
      `).join('');
    }

    // 初始化 drag and drop
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-indigo-500', 'bg-indigo-50/50');
    });
    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/50');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/50');
      if (e.dataTransfer.files.length > 0) {
        processFile(e.dataTransfer.files[0]);
      }
    });
    dropZone.addEventListener('click', () => {
      document.getElementById('file-input').click();
    });

    function handleFileSelect(e) {
      if (e.target.files.length > 0) {
        processFile(e.target.files[0]);
      }
    }

    // 解析檔案
    function processFile(file) {
      if (!file.name.endsWith('.srt')) {
        showToast('請上傳 .srt 格式的字幕檔案', 'error');
        return;
      }
      originalFileName = file.name;
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('file-info').classList.remove('hidden');

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        parseSRT(content);
        showToast(`已成功載入檔案並完成自動修正！`, 'success');
      };
      reader.readAsText(file, 'UTF-8');
    }

    // 解析 SRT 內容
    function parseSRT(data) {
      const normalizedData = data.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = normalizedData.trim().split(/\n\n+/);
      
      originalSRT = [];
      
      blocks.forEach(block => {
        const lines = block.split('\n');
        if (lines.length >= 2) {
          const id = lines[0].trim();
          const timeIndex = lines[1].includes('-->') ? 1 : -1;
          if (timeIndex !== -1) {
            const time = lines[1].trim();
            const text = lines.slice(timeIndex + 1).join('\n');
            originalSRT.push({ id, time, text });
          }
        }
      });

      applyReplacements();
    }

    // 依據內建字典執行全自動替換
    function applyReplacements() {
      if (originalSRT.length === 0) return;

      let totalReplacementsCount = 0;
      const searchKeys = Object.keys(REPLACE_MAP);

      modifiedSRT = originalSRT.map(item => {
        let newText = item.text;

        searchKeys.forEach(search => {
          if (!search) return;
          const replace = REPLACE_MAP[search];
          
          if (newText.includes(search)) {
            newText = newText.split(search).join(replace);
          }
        });

        const hasChanged = (newText !== item.text);
        if (hasChanged) totalReplacementsCount++;

        return {
          id: item.id,
          time: item.time,
          text: newText,
          originalText: item.text,
          hasChanged: hasChanged
        };
      });

      // 更新頁面統計
      document.getElementById('stat-total-count').textContent = originalSRT.length;
      document.getElementById('stat-replaced-count').textContent = totalReplacementsCount;

      // 啟用按鈕
      document.getElementById('btn-export-top').disabled = false;
      document.getElementById('btn-copy').disabled = false;

      renderSubtitles();
    }

    // 手動在列表中編輯字幕內容
    function updateManualText(index, val) {
      if (modifiedSRT[index]) {
        modifiedSRT[index].text = val;
        modifiedSRT[index].hasChanged = (val !== modifiedSRT[index].originalText);
        const count = modifiedSRT.filter(s => s.hasChanged).length;
        document.getElementById('stat-replaced-count').textContent = count;
      }
    }

    // 渲染字幕對比畫面
    function renderSubtitles() {
      const container = document.getElementById('subtitles-container');
      const filterText = document.getElementById('search-filter').value.toLowerCase();

      if (originalSRT.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center p-8 text-slate-400 text-center gap-3">
            <i class="fa-regular fa-closed-captioning text-4xl"></i>
            <p class="text-sm">請在上方的拖曳區上傳 `.srt` 字幕檔案以開始自動對比與修正</p>
          </div>
        `;
        document.getElementById('showing-count').textContent = `目前顯示：0 句`;
        return;
      }

      let filteredList = modifiedSRT.filter(item => {
        if (!filterText) return true;
        return item.text.toLowerCase().includes(filterText) || 
               item.originalText.toLowerCase().includes(filterText) || 
               item.id.includes(filterText);
      });

      document.getElementById('showing-count').textContent = `目前顯示：${filteredList.length} / ${originalSRT.length} 句`;

      if (filteredList.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 py-12 text-sm">找不到符合關鍵字「${escapeHtml(filterText)}」的字幕內容</div>`;
        return;
      }

      container.innerHTML = filteredList.map((item) => {
        const actualIndex = modifiedSRT.findIndex(s => s.id === item.id);
        
        let diffHtml = '';
        if (item.hasChanged) {
          diffHtml = `
            <div class="mb-1 text-xs text-slate-400 line-through">
              原字：${escapeHtml(item.originalText)}
            </div>
          `;
        }

        return `
          <div class="grid grid-cols-12 gap-2 p-3 text-xs items-start hover:bg-slate-50 transition ${item.hasChanged ? 'bg-amber-50/30' : ''}">
            <div class="col-span-2 sm:col-span-1 font-mono text-slate-400 pt-1">${item.id}</div>
            <div class="col-span-4 sm:col-span-3 font-mono text-slate-500 text-[11px] pt-1 leading-tight">
              ${item.time.replace(' --> ', '<br>➔ ')}
            </div>
            <div class="col-span-6 sm:col-span-8 flex flex-col gap-1">
              ${diffHtml}
              <textarea 
                oninput="updateManualText(${actualIndex}, this.value)"
                rows="${item.text.split('\n').length || 1}"
                class="w-full p-2 border ${item.hasChanged ? 'border-emerald-300 bg-emerald-50/20 text-emerald-900 font-medium' : 'border-slate-200 bg-white text-slate-700'} rounded-lg focus:outline-none focus:border-indigo-500 resize-y transition"
              >${escapeHtml(item.text)}</textarea>
            </div>
          </div>
        `;
      }).join('');
    }

    // 匯出生成 SRT
    function generateSRTString() {
      return modifiedSRT.map(item => {
        return `${item.id}\n${item.time}\n${item.text}`;
      }).join('\n\n') + '\n';
    }

    function exportSRT() {
      if (modifiedSRT.length === 0) return;

      const content = generateSRTString();
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      
      let exportName = "subtitles_fixed.srt";
      if (originalFileName) {
        exportName = originalFileName.replace(/\.srt$/i, '') + '_fixed.srt';
      }

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = exportName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showToast(`已下載修正後的 SRT：${exportName}`, 'success');
    }

    function copyToClipboard() {
      if (modifiedSRT.length === 0) return;
      const content = generateSRTString();
      
      const textarea = document.createElement('textarea');
      textarea.value = content;
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast('已複製修正後的全部 SRT 內容至剪貼簿', 'success');
      } catch (err) {
        showToast('複製失敗', 'error');
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const icons = {
        success: '<i class="fa-solid fa-circle-check text-emerald-500"></i>',
        error: '<i class="fa-solid fa-circle-xmark text-red-500"></i>',
        info: '<i class="fa-solid fa-circle-info text-indigo-500"></i>'
      };

      toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 bg-white border border-slate-200 shadow-xl rounded-xl text-xs font-medium text-slate-700 transition-all transform translate-y-2 opacity-0 duration-200`;
      toast.innerHTML = `${icons[type] || icons.info} <span>${escapeHtml(message)}</span>`;

      container.appendChild(toast);

      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
